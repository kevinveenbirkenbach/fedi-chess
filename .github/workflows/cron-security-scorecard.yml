name: "🛡️ Score supply chain"
run-name: "${{ github.event_name == 'schedule' && '⏰ ' || '' }}🛡️ Score supply chain"

on:
  branch_protection_rule:
  schedule:
    - cron: '00 00 * * *'
  push:
    branches:
      - main
      - master

concurrency:
  group: scorecard-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: 🔍 Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "🔬 Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "📊 Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
