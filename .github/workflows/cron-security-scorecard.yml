name: "🛡️ Score supply chain"
run-name: "${{ github.event_name == 'schedule' && '⏰ ' || '' }}🛡️ Score supply chain"

on:
  branch_protection_rule:
  schedule:
    - cron: '00 00 * * *'
  push:
    branches:
      - main
      - master

concurrency:
  group: scorecard-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: 🔍 Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: "🔬 Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "📊 Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4  # v3.38.1
        with:
          sarif_file: results.sarif
