name: e2e-and-build-image

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: 🧪 E2E (compose up + HTTP 200)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Checkout (with full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version tag on this commit (v*)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | sort -V | tail -n1)"
          highest="$(git tag --list 'v*' | sort -V | tail -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "${tag}" && "${tag}" == "${highest}" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run E2E test
        run: |
          chmod +x tests/e2e.sh
          bash tests/e2e.sh

  build:
    name: 🐳 Build & Push (${{ matrix.arch }})
    if: needs.e2e.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    needs: e2e
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.e2e.outputs.tag }}-${{ matrix.arch }}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish:
    name: 🏷️ Join architectures under the release tags
    runs-on: ubuntu-latest
    needs: [e2e, build]
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join both architectures under the release tags
        shell: bash
        env:
          TAG: ${{ needs.e2e.outputs.tag }}
          LATEST: ${{ needs.e2e.outputs.latest }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE_NAME}:${TAG}" -t "${IMAGE_NAME}:sha-${GITHUB_SHA::7}")
          if [[ "${LATEST}" == "true" ]]; then
            tags+=(-t "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
